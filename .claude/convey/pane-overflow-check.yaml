name: pane-overflow-check

# Visual test fixture for a form taller and wider than the convey pane.
# Each field takes three rows (title, control, gap). With the prompt template
# chooser and the card's border above, the k-th input starts at about row 3k + 1,
# so the markers below name the row they start on.
#
# Suggested checks:
#   1. Open it in a 24-row terminal, and again in fullscreen where the pane docks.
#   2. Tab past the row_25 and row_40 markers: does the focused field stay
#      visible? Does the wheel scroll the pane?
#   3. Pick a value in long_list (40 options) and wide_value (one very long option).
#   4. Expand the preview: it is long too, so check how it scrolls.
#   5. Reach the last marker (required) and press Fill prompt.
inputs:
  field_01_top_marker:
    type: textarea

  field_02:
    type: textarea

  field_03:
    type: textarea

  field_04:
    type: select
    candidates:
      values: [alpha, beta, gamma]

  long_list:
    type: select
    candidates:
      values: [option-01, option-02, option-03, option-04, option-05, option-06, option-07, option-08, option-09, option-10, option-11, option-12, option-13, option-14, option-15, option-16, option-17, option-18, option-19, option-20, option-21, option-22, option-23, option-24, option-25, option-26, option-27, option-28, option-29, option-30, option-31, option-32, option-33, option-34, option-35, option-36, option-37, option-38, option-39, option-40]

  field_05:
    type: textarea

  field_06:
    type: textarea

  field_07_row_25:
    type: select
    candidates:
      values: [alpha, beta, gamma]

  field_08:
    type: textarea

  field_09:
    type: textarea

  wide_value:
    type: select
    candidates:
      values: [short, a-very-long-candidate-value-that-keeps-going-that-keeps-going-that-keeps-going-that-keeps-going-that-keeps-going-that-keeps-going-that-keeps-going-that-keeps-going-end]

  field_10:
    type: select
    candidates:
      values: [alpha, beta, gamma]

  field_11_row_40:
    type: textarea

  field_12:
    type: textarea

  field_13:
    type: textarea

  field_14_midpoint:
    type: select
    candidates:
      values: [alpha, beta, gamma]

  field_15:
    type: textarea

  field_16:
    type: textarea

  field_17:
    type: textarea

  field_18:
    type: select
    candidates:
      values: [alpha, beta, gamma]

  field_19:
    type: textarea

  field_20:
    type: textarea

  field_21:
    type: textarea

  field_22:
    type: select
    candidates:
      values: [alpha, beta, gamma]

  field_23:
    type: textarea

  field_24:
    type: textarea

  field_25:
    type: textarea

  field_26:
    type: select
    candidates:
      values: [alpha, beta, gamma]

  field_27:
    type: textarea

  field_28:
    type: textarea

  field_29:
    type: textarea

  field_30_last_marker:
    type: select
    allow_empty: false
    candidates:
      values: [reached-the-end, not-reached]

output:
  template: |
    # Pane overflow check

    - field_01_top_marker: {{ inputs.field_01_top_marker }}
    - field_07_row_25: {{ inputs.field_07_row_25 }}
    - field_11_row_40: {{ inputs.field_11_row_40 }}
    - long_list: {{ inputs.long_list }}
    - wide_value: {{ inputs.wide_value }}
    - field_14_midpoint: {{ inputs.field_14_midpoint }}
    - field_30_last_marker: {{ inputs.field_30_last_marker }}

