name: code-review

inputs:
  focus:
    type: select
    candidates:
      values: [correctness, readability, performance, security]

  scope:
    type: select
    candidates:
      values: [staged changes, last commit, current branch]

  notes:
    type: textarea

output:
  template: |
    # Code review

    Review the {{ inputs.scope }} with a focus on {{ inputs.focus }}.
    {{#inputs.notes}}

    Notes: {{ inputs.notes }}
    {{/inputs.notes}}
