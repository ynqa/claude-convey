name: git-commit-review

inputs:
  branch:
    type: select
    candidates:
      command:
        program: git
        args: [branch, --format=%(refname:short)]

  commit:
    type: select
    allow_empty: false
    depends_on: [branch]
    candidates:
      command:
        program: git
        args: [log, --format=%h %s, -n, "20", "{{ inputs.branch }}"]

  request:
    type: textarea
    description: What to look at
    placeholder: e.g. Check the error handling and suggest missing tests

output:
  template: |
    # Commit review

    - Branch: `{{ inputs.branch }}`
    - Commit: {{ inputs.commit }}

    {{ inputs.request }}
